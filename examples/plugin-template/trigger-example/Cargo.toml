# Own [workspace] table (empty), same precedent as
# spike/wasi-p3-trigger-poc/guest/Cargo.toml: without one, `cargo build` run
# inside this directory would walk up to the root Cargo.toml, find it's a
# workspace, and error ("current package believes it's in a workspace when
# it's not") since this path is neither a listed member nor in root's
# `exclude` -- an empty [workspace] table here makes this directory its own
# workspace root instead, so root's Cargo.toml needs no edit.
[workspace]

[package]
name = "aerini-plugin-heartbeat-trigger"
version = "0.1.0"
edition = "2021"
description = "Aerini trigger-plugin example -- emits a heartbeat event on a configurable interval. See ./README.md and docs/plugin-authoring.md's \"Trigger plugins\" section."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Provides `wit_bindgen::generate!` (re-exported, pinned to 0.57.1 -- same
# version the base echo template pins directly) plus the async
# runtime-support types (`spawn`, `wit_stream`, `StreamReader`,
# `clocks::monotonic_clock`) an async `trigger.events` export needs. Used via
# `wasip3::wit_bindgen::generate!` rather than adding a second, separately
# versioned `wit-bindgen` dependency -- a second copy would not satisfy
# wasip3's own `^0.57.1` requirement under Cargo's 0.x semver rules, and
# would produce two incompatible copies of those runtime-support types.
# VERIFIED (spike/wasi-p3-trigger-poc's own research, this audit trail):
# 0.7.1+wasi-0.3.0 is current, final WASI 0.3.0 (not an -rc build).
wasip3 = { version = "0.7.1", features = ["wit-bindgen-macros", "async-spawn"] }
# Parses the trigger's own JSON config string (wit/node.wit's `trigger.events`
# doc comment). Pure-Rust, no OS-specific syscalls -- compiles cleanly to
# wasm32-wasip2. VERIFIED: 1.0.151 current on crates.io/docs.rs.
serde_json = "1.0.151"
