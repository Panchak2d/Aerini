# cargo-deny policy. CI runs `licenses bans sources`; advisories are checked by
# security-audit.yml (cargo audit, daily). The ignores below mirror
# .cargo/audit.toml so a local `cargo deny check` agrees with CI; reasons live in
# that file, and scripts/tests/test_deny_config.py fails if the two ID sets differ.

[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
# Permissive licenses only. Anything else (GPL, LGPL, AGPL, EPL, CDDL, SSPL,
# or an unknown license) fails the check and needs a deliberate decision.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # The project's own license; the workspace crates are not marked publish = false.
    { crate = "aerini", allow = ["AGPL-3.0-only"] },
    { crate = "aerini-engine", allow = ["AGPL-3.0-only"] },
    { crate = "aerini-server", allow = ["AGPL-3.0-only"] },
    # MPL-2.0 is file-level copyleft: fine for unmodified dependencies, but a
    # modified copy of any of these crates' files must stay under MPL-2.0.
    # tracking-allocator ships in aerini-server (via aerini-engine); the rest
    # reach only the desktop app. Review before adding to this list.
    { crate = "tracking-allocator", allow = ["MPL-2.0"] },
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
# Duplicate versions come from Tauri, wasmtime and sqlx pinning different majors;
# they are reported, not failed.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# allow-registry is omitted on purpose: the default is crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
