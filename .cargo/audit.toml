[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa 0.9.10 Marvin Attack timing side-channel.
    # No patched version of rsa exists. This is a transitive dep via sqlx-mysql.
    # Aerini does not use rsa directly; the MySQL auth handshake uses it internally.
    #
    # ACCEPTED RISK — with explicit operator scope:
    # The "trusted infrastructure" assumption holds only when the operator controls
    # the MySQL server that the Database node connects to. It does NOT hold when an
    # untrusted user can configure the Database node's connection_url to point at an
    # arbitrary MySQL server (e.g. an attacker-operated server in multi-tenant API
    # deployments). In that scenario, the attacker can measure RSA timing during the
    # TLS handshake to recover session material.
    #
    # If you run Aerini in API mode and allow untrusted callers to configure Database
    # node connection strings, treat this advisory as unmitigated until sqlx ships
    # a fix. See docs/security.md#known-transitive-dependency-risks for details.
    #
    # Exploiting requires: sustained measurement of many handshakes by a
    # network-adjacent attacker (high bar on WAN; realistic on LAN or same-host).
    # Track upstream: https://github.com/launchbadge/sqlx/issues/3538
    #
    # TODO: re-check this suppression when sqlx >= 0.9 ships with a patched `rsa`
    # dependency, and remove this entry once sqlx-mysql no longer pulls in the
    # vulnerable rsa version.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter unsoundness.
    # Patched in glib >=0.20.0 which requires GTK4. Transitive via Tauri 2 → webkit2gtk → GTK3.
    # Cannot upgrade without Tauri migrating to GTK4. Track: https://github.com/tauri-apps/tauri
    "RUSTSEC-2024-0429",

    # GTK3 bindings unmaintained (RUSTSEC-2024-0411 through 0420).
    # All transitive via Tauri 2 → webkit2gtk. Cannot remove without replacing Tauri.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",

    # RUSTSEC-2024-0370: proc-macro-error unmaintained.
    # Transitive build dep. No prod impact. Track replacement upstream.
    "RUSTSEC-2024-0370",

    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml 0.36.2 DoS (quadratic
    # attribute-dup check / unbounded namespace allocation).
    # Transitive via docx-rs 0.4.20 (direct dep, nodes/text_to_file.rs DOCX
    # export), which pins quick-xml = "^0.36". Verified via crates.io API
    # (2026-07-17): 0.4.20 is docx-rs's latest published release — no newer
    # version exists to pull a patched quick-xml (>=0.41.0). Cannot fix by
    # upgrading; would require docx-rs's maintainer to bump the pin, or
    # replacing docx-rs. Same advisory pair against docx-rs's other resolved
    # copy of quick-xml is fixed via plist 1.10.0 (`cargo update -p plist`).
    #
    # Exploiting requires: feeding a crafted/oversized DOCX-internal XML
    # payload through docx-rs's parser. Aerini only uses docx-rs to *write*
    # DOCX output (nodes/text_to_file.rs), not to parse untrusted input —
    # low real-world exposure. Re-check when docx-rs publishes a new release.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # unic-* crate family (all "unmaintained", no vulnerability, no fix available):
    # Transitive via Tauri: tauri-utils -> urlpattern 0.3.0 -> unic-ucd-ident ->
    # unic-char-range / unic-char-property, and unic-ucd-ident -> unic-ucd-version
    # -> unic-common. All of open-i18n/rust-unic is archived; there is no drop-in
    # replacement upstream can swap to without urlpattern itself moving off it.
    # Cannot fix without Tauri bumping tauri-utils past this urlpattern pin.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
