# Keep the ignore list identical to [advisories].ignore in deny.toml (checked by scripts/tests/test_deny_config.py).
[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa 0.9.10 Marvin Attack timing side-channel.
    # No patched version of rsa exists. This is a transitive dep via sqlx-mysql.
    # Aerini does not use rsa directly; the MySQL auth handshake uses it internally.
    #
    # ACCEPTED RISK — with explicit operator scope:
    # The "trusted infrastructure" assumption holds only when the operator controls
    # the MySQL server that the Database node connects to. It does NOT hold when an
    # untrusted user can configure the Database node's connection_url to point at an
    # arbitrary MySQL server (e.g. an attacker-operated server in multi-tenant API
    # deployments). In that scenario, the attacker can measure RSA timing during the
    # TLS handshake to recover session material.
    #
    # If you run Aerini in API mode and allow untrusted callers to configure Database
    # node connection strings, treat this advisory as unmitigated until sqlx ships
    # a fix. See the "Dangerous nodes" section of docs/guide/security.md.
    #
    # Exploiting requires: sustained measurement of many handshakes by a
    # network-adjacent attacker (high bar on WAN; realistic on LAN or same-host).
    # Track upstream: https://github.com/launchbadge/sqlx/issues/3538
    #
    # TODO: re-check this suppression when sqlx >= 0.9 ships with a patched `rsa`
    # dependency, and remove this entry once sqlx-mysql no longer pulls in the
    # vulnerable rsa version.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter unsoundness.
    # Patched only in glib >=0.20.0. Transitive via Tauri 2 → tao/wry/webkit2gtk → gtk 0.18 → glib ^0.18;
    # the newest tauri (2.12.0), tao (0.37.1), wry (0.57.0) and webkit2gtk (2.0.2) all still pin gtk ^0.18,
    # so no upgrade reaches a patched glib. Not reachable from this app: the only entry point is
    # `glib::Variant::array_iter_str`, and no glib-dependent crate in Cargo.lock calls it (Linux desktop
    # build only). Re-check when Tauri moves off gtk 0.18. Track: https://github.com/tauri-apps/tauri
    "RUSTSEC-2024-0429",

    # RUSTSEC-2024-0370: proc-macro-error unmaintained.
    # Transitive build dep. No prod impact. Track replacement upstream.
    "RUSTSEC-2024-0370",

    # zip 8.6.0 (RUSTSEC-2026-0367, -0368, -0369): symlink escape, symlink-followed permission
    # changes and preserved SUID/SGID bits, all in `ZipArchive::extract` / `ZipStreamReader::extract`.
    # Patched only in zip >=9.0.0. The one remaining copy of zip 8 is transitive via docx-rs
    # (latest 0.4.22 requires `zip ^8.6.0`), used by the Text to File node to write `.docx`.
    # Not reachable: docx-rs 0.4.22 never calls either `extract` (VERIFIED by reading its source),
    # and Aerini's own zip use is on zip 9. The updater's older zip 4 copy is gone: src-tauri turns
    # off the updater's `zip` feature. Remove these three entries once docx-rs moves to zip >=9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # zbus family (RUSTSEC-2026-0370 zvariant, -0371 zbus_names, -0372 zvariant_derive): "unmaintained", no vulnerability. The crates were merged into zbus 6.0.0 and
    # every standalone release is flagged, so no bump of these crates clears the advisory.
    # Two trees remain: zbus 4 via keyring 3.6.3 -> secret-service 4.0.0 (and the engine's own
    # zbus 4, which must stay on keyring's major so no extra crate is built), and zbus 5 via
    # tauri-plugin-opener (desktop only). Remove these entries once keyring and tauri-plugin-opener
    # move to zbus 6. Track: https://github.com/z-galaxy/zbus/issues/2043
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
