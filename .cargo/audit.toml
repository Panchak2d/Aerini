[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa 0.9.10 Marvin Attack timing side-channel.
    # No patched version of rsa exists. This is a transitive dep via sqlx-mysql.
    # Flowo does not use rsa directly; the MySQL auth handshake uses it internally.
    # Mitigated by: (1) MySQL connections are to trusted infrastructure, not attacker-
    # controlled endpoints; (2) exploiting requires sustained observation of many
    # handshakes by a network-adjacent attacker. Track upstream:
    # https://github.com/launchbadge/sqlx/issues/3538
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0097: rand unsoundness with custom logger.
    # rand 0.7.3 (transitive via phf_generator → build-time only, never in prod binary)
    # rand 0.9.2 (transitive via quinn-proto → reqwest; no patch for 0.9 series yet — 
    #             only >=0.9.3 is patched; upstream quinn has not released 0.9.3 yet)
    # Direct dep (flowo-server rand 0.8) bumped to 0.8.6 (patched).
    # The unsoundness requires: log+thread_rng features + custom logger + reseeding.
    # Flowo does not install a custom log backend that calls rand.
    "RUSTSEC-2026-0097",

    # RUSTSEC-2024-0429: glib 0.18.5 VariantStrIter unsoundness.
    # Patched in glib >=0.20.0 which requires GTK4. Transitive via Tauri 2 → webkit2gtk → GTK3.
    # Cannot upgrade without Tauri migrating to GTK4. Track: https://github.com/tauri-apps/tauri
    "RUSTSEC-2024-0429",

    # GTK3 bindings unmaintained (RUSTSEC-2024-0411 through 0420).
    # All transitive via Tauri 2 → webkit2gtk. Cannot remove without replacing Tauri.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",

    # RUSTSEC-2024-0370: proc-macro-error unmaintained.
    # Transitive build dep. No prod impact. Track replacement upstream.
    "RUSTSEC-2024-0370",

    # RUSTSEC-2025-0057: fxhash unmaintained.
    # Transitive dep. Replaced by rustc-hash upstream; waiting on dependents.
    "RUSTSEC-2025-0057",

    # RUSTSEC-2025-0075, -0080, -0081, -0098, -0100: unic-* unmaintained.
    # All transitive. No direct use of these Unicode crates in Flowo.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]
