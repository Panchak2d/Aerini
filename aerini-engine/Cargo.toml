[package]
name = "aerini-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "aerini_engine"

[dependencies]
# Async
tokio       = { version = "1.0", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Serde
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Graph
petgraph = "0.8"

# SQLite
rusqlite    = { version = "0.38", features = ["bundled"] }
r2d2        = "0.8"
r2d2_sqlite = { version = "0.32", features = ["bundled"] }
dashmap     = "6.1"

# Encryption (credential store)
aes-gcm = "0.11.0"
rand_core = { version = "0.6", features = ["getrandom"] }
base64  = "0.22"
zeroize = "1"

# HTTP node
reqwest = { version = "0.13", features = ["json", "rustls", "query", "form", "multipart"], default-features = false }
url     = "2"

# Webhook node HTTP server (already transitive via reqwest; listed explicitly for clarity)
hyper          = { version = "1", features = ["server", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Email node
lettre = { version = "0.11.22", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "hostname",
] }

# Security
subtle = "2.6"
blake3 = "1"

# Plugin signature verification (load-path authenticity/integrity check,
# plugin_loader::signature). 3.0.0 VERIFIED current stable on crates.io
# (docs.rs latest tag, 2026-07-06 release, not yanked). default-features =
# false: the default "fast"/"zeroize" features are signing/precomputed-table
# performance and secret-key zeroing — irrelevant here, this crate is used
# verify-only, no SigningKey ever exists in this app. Same convention as
# src-tauri/Cargo.toml's own ed25519-dalek entry.
ed25519-dalek = { version = "3.0.0", default-features = false }

# Diagnostics
tracing = "0.1"

# Utils
uuid      = { version = "1.8", features = ["v4"] }
chrono    = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
once_cell = "1"

# Code node sandbox
# tempfile: named temp files for the ESM loader script (non-Windows only)
# libc: setrlimit() for Linux resource limits in sandbox mode; killing a
# command's process group on Unix (nodes::util::kill_group_on_drop)
tempfile = "3"

# Text to File node — PDF/DOCX export
# pdf-writer 0.15.0: VERIFIED current stable (2026-06-28, fetched the published
# .crate's own Cargo.toml from static.crates.io). License MIT OR Apache-2.0.
# Runtime deps are exactly 4 tiny, long-standing crates: bitflags, itoa, memchr,
# ryu — no lopdf, no kuchiki, no azul-*, no bincode, no hyphenation.
#
# printpdf 0.9.1 (its only published version) hard-pins `lopdf = "0.39.0"`
# (non-optional — pulled regardless of feature flags), which carries
# RUSTSEC-2026-0187 (stack overflow via deeply nested PDF *objects*, triggered
# by lopdf::Document::load parsing an untrusted file). printpdf has no newer
# release that bumps this, and Cargo's [patch] table can't force a fix in
# either — a patch must still satisfy the dependent's own version requirement
# or Cargo silently drops it (rust-lang/cargo#8690), and lopdf 0.42.0 (the
# fixed version) doesn't satisfy printpdf's `^0.39.0`.
#
# pdf-writer is a pure *writer* — it has no PDF parser at all, so it cannot
# have a "parsing untrusted input" vulnerability class by construction, not
# just "currently unreachable in our usage."
pdf-writer = "0.15.0"
docx-rs    = "0.4.20"

# Webhook node: RAII port-deregistration guard on all exit paths
scopeguard = "1"


tracking-allocator = "0.4"

# JSON Schema validation
# default-features = false: omits HTTP/TLS resolver — not needed since Aerini schemas are inline.
jsonschema = { version = "0.46", default-features = false }

# OS keychain integration
# All five feature flags are safe to list together — each is gated behind
# platform detection inside the keyring crate itself.
# apple-native  → macOS Keychain (security-framework)
# windows-native → Windows Credential Manager (windows-sys)
# async-secret-service + tokio + crypto-rust → Linux SecretService via zbus,
# a pure-Rust D-Bus client with no libdbus/pkg-config dependency, required
# for musl cross-compilation. keyring's own Entry API stays fully
# synchronous either way — don't swap this back to sync-secret-service,
# which pulls in dbus-secret-service/libdbus-sys and has no musl path.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# Database node — Postgres + MySQL
# no default-features: avoids pulling in compile-time query macros (DATABASE_URL not needed).
# any     — AnyPool runtime URL dispatch
# postgres — Postgres driver
# mysql   — MySQL/MariaDB driver
# runtime-tokio-rustls — tokio executor + rustls TLS (matches existing reqwest choice)
sqlx = { version = "0.8", default-features = false, features = ["postgres", "mysql", "runtime-tokio-rustls"] }

# Redis node
# tokio-comp — async Tokio connection manager (MultiplexedConnection)
redis = { version = "1.0", features = ["tokio-comp"] }

# S3 / object storage node
# Uses the AWS-maintained SDK (aws-smithy-runtime → hyper 1.0 directly) —
# no reqwest dependency, so it can't reintroduce a dual-reqwest tree.
#
# Features:
#   behavior-version-latest  — sets BehaviorVersion::latest() automatically; no explicit call needed
#   rt-tokio                 — tokio async runtime integration
#   default-https-client     — modern rustls 0.23 TLS path (avoids RUSTSEC-2026-0099 legacy stack)
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }

# WASM plugin system
# component-model feature only on the sync engine — component-model-async
# is scoped to the dedicated trigger engine below (sync WIT interface for
# ordinary action plugins).
# wasmtime-wasi-http adds wasi:http/outgoing-handler support: "p2" backs
# the sync plugin engine's HTTP linking, "p3" backs the trigger engine's
# (see plugin_loader.rs's module doc, "Trigger plugins").
#
# `wasmtime-wasi`'s "p3" feature gates `wasmtime_wasi::p3` (WASI 0.3 /
# component-model-async), used by the second, dedicated async Engine that
# hosts trigger-plugin components (`aerini-node-with-trigger` world). The
# default (p2, sync) plugin engine is unaffected by this feature.
#
# All three pinned to an EXACT version (`=49.0.1`) rather than a caret range:
# both `wasmtime-wasi::p3` and `wasmtime-wasi-http::p3` document themselves as
# "not compliant with semver and not ready for production use" with no
# patch-release guarantee even for security fixes. A caret range on a crate
# with that disclaimer means any future point release can change or break the
# p3 surfaces this crate depends on with no warning; an exact pin turns the
# next bump into a deliberate, reviewed upgrade instead of a silent one.
# Bump only all three together, and re-verify the p3 surfaces this crate
# depends on (plugin_loader.rs's trigger-engine linking) before doing so.
# Wasmtime only patches its two most recent releases (plus periodic LTS
# lines), so an exact pin also has to be moved forward when the next major ships.
wasmtime           = { version = "=49.0.1", features = ["component-model"] }
wasmtime-wasi      = { version = "=49.0.1", features = ["p3"] }
wasmtime-wasi-http = { version = "=49.0.1", features = ["p2", "p3"] }

# Filesystem watching (WIT `fs-watch` import backing, plugin_loader.rs's
# FsWatchRegistry). Cross-platform: inotify (Linux), FSEvents (macOS),
# ReadDirectoryChangesW (Windows) — the same crate `cargo watch`,
# `rust-analyzer`, and `watchexec` use. Latest stable is 8.2.0; `"8"` picks
# up later 8.x releases automatically — re-run `cargo update -p notify` and
# confirm MSRV against this workspace's toolchain on a real build machine.
notify = "8"

# Security: pin rustls-webpki to patched version (RUSTSEC-2026-0098, -0099, -0104).
# Transitive via reqwest/sqlx/rustls. Direct dep forces Cargo to unify at >=0.103.13.
# Remove once reqwest/sqlx update their own pins.
rustls-webpki = "0.103.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3"
# hooks: Connection::authorizer, used only by
# nodes::ai_memory::tests::append_fails_cleanly_when_seq_lookup_errors to
# force get_next_seq's SELECT to fail without a trigger (triggers don't fire
# on SELECT). Test-only: unified into the dev-profile build alongside the
# main rusqlite dependency above, does not affect the non-test feature set.
rusqlite = { version = "0.38", features = ["hooks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
