[package]
name = "aerini-engine"
version.workspace = true
edition.workspace = true

[lib]
name = "aerini_engine"

[dependencies]
# Async
tokio       = { version = "1.0", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Serde
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Graph
petgraph = "0.8"

# SQLite
rusqlite    = { version = "0.38", features = ["bundled"] }
r2d2        = "0.8"
r2d2_sqlite = { version = "0.32", features = ["bundled"] }
dashmap     = "6.1"

# Encryption (credential store)
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64  = "0.22"

# HTTP node
reqwest = { version = "0.13", features = ["json", "rustls", "query", "form", "multipart"], default-features = false }
url     = "2"

# Webhook node HTTP server (already transitive via reqwest; listed explicitly for clarity)
hyper          = { version = "1", features = ["server", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Email node
lettre = { version = "0.11.22", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "hostname",
] }

# Security
subtle = "2.6"
blake3 = "1"

# Diagnostics
tracing = "0.1"

# Utils
uuid      = { version = "1.8", features = ["v4"] }
chrono    = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
once_cell = "1"

# Code node sandbox
# tempfile: named temp files for the ESM loader script (non-Windows only)
# libc: setrlimit() for Linux resource limits in sandbox mode
tempfile = "3"

# Text to File node — PDF/DOCX export
# pdf-writer 0.15.0: VERIFIED current stable (2026-06-28, fetched the published
# .crate's own Cargo.toml from static.crates.io). License MIT OR Apache-2.0.
# Runtime deps are exactly 4 tiny, long-standing crates: bitflags, itoa, memchr,
# ryu — no lopdf, no kuchiki, no azul-*, no bincode, no hyphenation.
#
# Replaces printpdf (see PATCH NOTES / git history for the prior dependency).
# printpdf 0.9.1 (its only published version) hard-pins `lopdf = "0.39.0"`
# (non-optional — pulled regardless of feature flags), which carries
# RUSTSEC-2026-0187 (stack overflow via deeply nested PDF *objects*, triggered
# by lopdf::Document::load parsing an untrusted file). printpdf has no newer
# release that bumps this, and Cargo's [patch] table can't force a fix in
# either — a patch must still satisfy the dependent's own version requirement
# or Cargo silently drops it (rust-lang/cargo#8690), and lopdf 0.42.0 (the
# fixed version) doesn't satisfy printpdf's `^0.39.0`.
#
# pdf-writer is a pure *writer* — it has no PDF parser at all, so it cannot
# have a "parsing untrusted input" vulnerability class by construction, not
# just "currently unreachable in our usage." This is a real fix, not a risk
# acceptance: see git history for the now-removed .cargo/audit.toml ignore
# entries this replaced.
pdf-writer = "0.15.0"
docx-rs    = "0.4.20"

# Webhook node: RAII port-deregistration guard on all exit paths
scopeguard = "1"

# Batch AH (PLAN_CORE.md §M): per-workflow/per-node live memory attribution.
# 0.4.0 VERIFIED current on crates.io/docs.rs this batch — GlobalAlloc-compatible
# wrapper allocator + AllocationGroupToken/AllocationTracker for grouping
# allocations by an arbitrary logical scope. MPL-2.0. Installed as the
# process #[global_allocator] in lib.rs — see mem_tracking.rs for why this is
# safe across the three binaries (src-tauri, aerini-server, and this crate's
# own `cargo test` harness) that link this crate.
tracking-allocator = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# JSON Schema validation
# default-features = false: omits HTTP/TLS resolver — not needed since Aerini schemas are inline.
jsonschema = { version = "0.46", default-features = false }

# OS keychain integration
# All four feature flags are safe to list together — each is gated behind
# platform detection inside the keyring crate itself.
# apple-native  → macOS Keychain (security-framework)
# windows-native → Windows Credential Manager (windows-sys)
# sync-secret-service + crypto-rust → Linux SecretService (D-Bus, pure-Rust crypto)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Database node — Postgres + MySQL
# no default-features: avoids pulling in compile-time query macros (DATABASE_URL not needed).
# any     — AnyPool runtime URL dispatch
# postgres — Postgres driver
# mysql   — MySQL/MariaDB driver
# runtime-tokio-rustls — tokio executor + rustls TLS (matches existing reqwest choice)
sqlx = { version = "0.8", default-features = false, features = ["postgres", "mysql", "runtime-tokio-rustls"] }

# Redis node
# tokio-comp — async Tokio connection manager (MultiplexedConnection)
redis = { version = "1.0", features = ["tokio-comp"] }

# S3 / object storage node
# Migrated from rust-s3 0.37 (required reqwest 0.12, causing dual reqwest in the tree)
# to the AWS-maintained SDK which uses aws-smithy-runtime → hyper 1.0 directly.
# No reqwest dependency — eliminates the dual reqwest issue entirely.
#
# Features:
#   behavior-version-latest  — sets BehaviorVersion::latest() automatically; no explicit call needed
#   rt-tokio                 — tokio async runtime integration
#   default-https-client     — modern rustls 0.23 TLS path (avoids RUSTSEC-2026-0099 legacy stack)
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }

# WASM plugin system
# component-model feature only — component-model-async is NOT enabled (sync WIT interface).
# wasmtime-wasi-http adds wasi:http/outgoing-handler support.
wasmtime           = { version = "46.0.1", features = ["component-model"] }
wasmtime-wasi      = "46.0.1"
wasmtime-wasi-http = { version = "46.0.1", features = ["p2"] }

# Security: pin rustls-webpki to patched version (RUSTSEC-2026-0098, -0099, -0104).
# Transitive via reqwest/sqlx/rustls. Direct dep forces Cargo to unify at >=0.103.13.
# Remove once reqwest/sqlx update their own pins.
rustls-webpki = "0.103.13"

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
