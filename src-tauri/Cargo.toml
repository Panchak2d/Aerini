[package]
name = "aerini"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aerini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aerini"
path = "src/main.rs"

[dependencies]
aerini-engine = { path = "../aerini-engine" }

# Tauri
tauri              = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog   = "2.0"
# tauri-plugin-fs is used Rust-side only (std::fs in lib.rs commands).
# No fs:allow-* capabilities are granted in capabilities/default.json — the webview
# has no filesystem access. Do not add webview fs capabilities without security review.
tauri-plugin-fs       = "2.0"
tauri-plugin-autostart = "2.0"

# Async (needed for spawn_blocking wrappers in tauri commands)
tokio      = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serde (tauri commands use these directly)
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid  = { version = "1.8", features = ["v4"] }
zip    = { version = "8", default-features = false, features = ["deflate"] }
blake3 = "1"
# Password hashing for run_secret
argon2 = "0.5"

# Base64 decode for write_temp_file — already in workspace via aerini-engine
base64 = "0.22"

# Plugin signature verification (install-time authenticity/integrity check,
# commands/plugins.rs). 3.0.0 VERIFIED current stable on crates.io
# (published 2026-07-06, not yanked; the one historical advisory,
# RUSTSEC-2022-0093, is fixed as of 2.0 and doesn't apply regardless — this
# crate is used verify-only, no SigningKey/keypair ever exists in this app).
# MSRV 1.85 per its own Cargo.toml, satisfied by this workspace's
# `dtolnay/rust-toolchain@stable` CI (no older toolchain pinned anywhere in
# this repo). default-features = false: the default "fast"/"zeroize"
# features exist for signing/precomputed-table performance and secret-key
# zeroing — irrelevant here since the app only calls
# VerifyingKey::verify_strict on a public key, never generates or holds a
# private key. Same minimal-features convention as sysinfo below.
ed25519-dalek = { version = "3.0.0", default-features = false }

# Structured logging — used for plugin_dir warnings in setup
tracing = "0.1"

# HTTP client for the manual "Check for Updates" GitHub Releases lookup (About section)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
url     = "2"

# Process-wide RSS for the Monitor panel's primary Memory stat — see
# commands/memory.rs::get_process_memory. 0.39.6 VERIFIED current
# (crates.io + docs.rs, checked this pass) — newer than the 0.39.3 this
# batch's brief cited; same 0.39.x line, no breaking API change between
# them. MSRV 1.95 per its own docs.rs page — confirm the build machine's
# `rustc --version` meets this before merging (not verifiable from this
# sandbox, which has no Rust toolchain). default-features = false + only
# "system": trims the "component"/"disk"/"network"/"user" families that
# are default-on upstream but unused here (a single process's own memory
# needs none of them), matching this file's existing minimal-features
# convention (see reqwest, aws-sdk-s3 in aerini-engine/Cargo.toml).
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# Staging area for multi-node package installs (commands/plugins.rs::install_plugin_pack_from_path):
# each member needs a real path on disk for PluginLoader::describe_plugin (&Path,
# not bytes), so extracted members are written to a TempDir, described, and only
# copied into plugin_dir once every check has passed. Already a workspace
# dependency (aerini-engine uses it for the same "need a real temp file"
# pattern); version already resolved in Cargo.lock at 3.27.0, no new
# transitive dependencies. Also used by this crate's own tests (tempdir-based,
# matching plugin_loader.rs's existing test style).
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
