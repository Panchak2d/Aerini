[package]
name = "flowo"
version = "0.1.0"
edition = "2021"

[lib]
name = "flowo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "flowo"
path = "src/main.rs"

[dependencies]
flowo-engine = { path = "../flowo-engine" }

# Tauri
tauri              = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell    = "2.0"
tauri-plugin-dialog   = "2.0"
# tauri-plugin-fs is used Rust-side only (std::fs in lib.rs commands).
# No fs:allow-* capabilities are granted in capabilities/default.json — the webview
# has no filesystem access. Do not add webview fs capabilities without security review.
tauri-plugin-fs       = "2.0"
tauri-plugin-autostart = "2.0"

# Async (needed for spawn_blocking wrappers in tauri commands)
tokio      = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serde (tauri commands use these directly)
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid  = { version = "1.8", features = ["v4"] }
zip    = { version = "2", default-features = false, features = ["deflate"] }
blake3 = "1"
# Password hashing for run_secret
argon2 = "0.5"

# Base64 decode for write_temp_file — already in workspace via flowo-engine
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
