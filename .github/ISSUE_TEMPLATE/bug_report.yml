name: Bug report
description: Reproducible bugs and incorrect behavior.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Aerini version
      description: Found in Settings → About, or run `cargo pkgid aerini`.
      placeholder: "e.g. 0.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "e.g. macOS 14.4, Windows 11, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that consistently reproduce the bug.
      placeholder: |
        1. Open Aerini
        2. Add an HTTP node
        3. ...
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow (if relevant)
      description: Export and paste the workflow JSON, or describe the node configuration.

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: text
