name: Security Audit

on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/security-audit.yml'
      - 'audit.toml'
      - '.cargo/audit.toml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # Daily at 06:00 UTC — picks up new advisories even without dependency changes
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Audit Rust Dependencies
        uses: actions-rust-lang/audit@v1
        # audit.toml at repo root is auto-detected by cargo-audit; it contains
        # documented ignores for unfixable transitive advisories.
        # Issues are created automatically for critical vulnerabilities on
        # main/master. Informational advisories are reported but do not fail.
