name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Add swap space
        run: bash scripts/ci-add-swap.sh

      - name: Install Linux system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libdbus-1-dev mold

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # src-tauri excluded here: this job's runner has no Tauri GUI deps installed.
      # It's covered by the tauri-build job below instead.
      - name: Build
        run: cargo build -p aerini-engine -p aerini-server --locked
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Test engine
        run: cargo test -p aerini-engine --locked
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Test server
        run: cargo test -p aerini-server --locked
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Clippy
        run: cargo clippy -p aerini-engine -p aerini-server --locked -- -D warnings
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  template-wit-sync:
    name: Example plugin template WIT files match canonical
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # examples/plugin-template/wit/node.wit and its trigger-example subcrate's own
      # copy are duplicated, not symlinked, so the template still works as a
      # self-contained starting point when copied out of this repo on its own (see
      # examples/plugin-template/README.md). Same pattern as the "dist/ is not
      # stale" check below: compare against the source of truth and fail loud if a
      # copy has drifted, instead of letting it go silently stale like it did before.
      - name: Diff template wit copies against canonical
        run: |
          diff aerini-engine/wit/node.wit examples/plugin-template/wit/node.wit || \
            (echo "ERROR: examples/plugin-template/wit/node.wit is stale — copy aerini-engine/wit/node.wit over it and commit" && exit 1)
          diff aerini-engine/wit/node.wit examples/plugin-template/trigger-example/wit/node.wit || \
            (echo "ERROR: examples/plugin-template/trigger-example/wit/node.wit is stale — copy aerini-engine/wit/node.wit over it and commit" && exit 1)

  trigger-example-build:
    name: Trigger example plugin builds for wasm32-wasip2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable) with wasm32-wasip2
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Build trigger example
        working-directory: examples/plugin-template/trigger-example
        run: cargo build --target wasm32-wasip2 --release --locked

  node-checks:
    name: Node.js dependency audit and dist staleness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Frontend tests (vitest)
        run: npm test

      - name: Check dist/ is not stale
        # Rebuilds the Vite frontend bundle and fails if dist/ differs from what is committed.
        # Uses `vite:build` (not `build`) because the `build` script invokes `tauri build`,
        # which requires GUI system libraries not available in a headless CI environment.
        # If this step fails, run `npm run vite:build` locally and commit the updated dist/.
        run: |
          npm run vite:build
          git diff --exit-code dist/ || (echo "ERROR: dist/ is stale — run 'npm run vite:build' and commit the result" && exit 1)

  docs-build:
    name: Docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

  tauri-build:
    name: Build desktop app (src-tauri)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: ubuntu-24.04-arm
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: startsWith(matrix.platform, 'ubuntu')
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Add swap space
        if: startsWith(matrix.platform, 'ubuntu')
        run: bash scripts/ci-add-swap.sh

      # GTK/WebKit bundling deps; same list as release.yml.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-

      - name: Install frontend dependencies
        run: npm ci

      # tauri.conf.json's externalBin expects src-tauri/binaries/node-bundled-<target-triple>
      # to already exist; without this, tauri build fails to find the sidecar.
      - name: Fetch and stage Node binaries
        shell: bash
        run: bash scripts/fetch-node-binaries.sh

      # Full `tauri build` (not vite:build) — this is the check the desktop binary
      # itself, not just the frontend bundle, actually compiles and packages on
      # every platform it ships for. The updater signing key is required because
      # createUpdaterArtifacts is on; nothing here is uploaded or published.
      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build
