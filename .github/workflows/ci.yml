name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libdbus-1-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # src-tauri excluded: requires Tauri-specific system GUI deps not available on ubuntu-latest.
      # Build and smoke-test locally with: npm run build
      - name: Build
        run: cargo build -p aerini-engine -p aerini-server --locked

      - name: Test
        run: cargo test -p aerini-engine --locked

      - name: Clippy
        run: cargo clippy -p aerini-engine -p aerini-server --locked -- -D warnings

  node-checks:
    name: Node.js dependency audit and dist staleness
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        # --omit=dev excludes devDependencies (esbuild, vite) from the audit.
        # GHSA-gv7w-rqvm-qjhr affects esbuild 0.17-0.28.0 via Deno's module loader
        # only - not Node.js. esbuild is a build-time devDep; not present in
        # production. The only safe version outside the advisory range (0.28.1)
        # drops transpilation support for the browser targets this project requires,
        # breaking vite:build. Auditing prod deps only is the correct posture here.
        run: npm audit --omit=dev --audit-level=high

      - name: Check dist/ is not stale
        # Rebuilds the Vite frontend bundle and fails if dist/ differs from what is committed.
        # Uses `vite:build` (not `build`) because the `build` script invokes `tauri build`,
        # which requires GUI system libraries not available in a headless CI environment.
        # If this step fails, run `npm run vite:build` locally and commit the updated dist/.
        run: |
          npm run vite:build
          git diff --exit-code dist/ || (echo "ERROR: dist/ is stale — run 'npm run vite:build' and commit the result" && exit 1)
