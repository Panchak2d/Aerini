name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Bump deliberately, together with the same value in release.yml. Every locked
  # dependency's rust-version is at or below this workspace's 1.96 floor.
  RUST_TOOLCHAIN: 1.97.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Add swap space
        run: bash scripts/ci-add-swap.sh

      - name: Install Linux system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libdbus-1-dev mold

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # src-tauri excluded here: this job's runner has no Tauri GUI deps installed.
      # It's covered by the tauri-build job below instead.
      - name: Build
        run: cargo build -p aerini-engine -p aerini-server --locked
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Test engine
        run: cargo test -p aerini-engine --locked --features schema
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Test server
        run: cargo test -p aerini-server --locked
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Clippy
        run: cargo clippy -p aerini-engine -p aerini-server --locked --features aerini-engine/schema -- -D warnings
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Test MCP server
        run: cargo test -p aerini-mcp --locked
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Test MCP server (offline mode)
        run: cargo test -p aerini-mcp --locked --features offline
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Clippy MCP server
        run: cargo clippy -p aerini-mcp --all-targets --locked -- -D warnings && cargo clippy -p aerini-mcp --all-targets --locked --features offline -- -D warnings
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  test-windows:
    name: Windows-only engine tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-engine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-engine-

      # Filtered to the tests that cover Windows-specific code. The rest of the engine
      # suite assumes a Unix host and is run by the Linux job above. --include-ignored
      # runs the tests that need a real Windows shell; the one that shows a real toast
      # needs a desktop session, which a runner does not have, so it is skipped.
      - name: Test Windows-specific engine code
        shell: bash
        run: cargo test -p aerini-engine --locked -- nodes::shell nodes::notification --include-ignored --skip the_windows_toast_command_runs_to_completion --nocapture

  template-wit-sync:
    name: Example plugin template WIT files match canonical
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # examples/plugin-template/wit/node.wit and its trigger-example subcrate's own
      # copy are duplicated, not symlinked, so the template still works as a
      # self-contained starting point when copied out of this repo on its own (see
      # examples/plugin-template/README.md). Same pattern as the "dist/ is not
      # stale" check below: compare against the source of truth and fail loud if a
      # copy has drifted, instead of letting it go silently stale like it did before.
      - name: Diff template wit copies against canonical
        run: |
          diff aerini-engine/wit/node.wit examples/plugin-template/wit/node.wit || \
            (echo "ERROR: examples/plugin-template/wit/node.wit is stale — copy aerini-engine/wit/node.wit over it and commit" && exit 1)
          diff aerini-engine/wit/node.wit examples/plugin-template/trigger-example/wit/node.wit || \
            (echo "ERROR: examples/plugin-template/trigger-example/wit/node.wit is stale — copy aerini-engine/wit/node.wit over it and commit" && exit 1)

  release-scripts:
    name: Release scripts and updater config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the release scripts
        run: python3 -I -m unittest discover -s scripts/tests

      - name: Check the updater configuration
        if: github.repository == 'Panchak2d/aerini'
        run: python3 -I scripts/verify-updater-config.py "$GITHUB_REPOSITORY"

      - name: Lint the release shell scripts
        run: shellcheck scripts/*.sh

  trigger-example-build:
    name: Trigger example plugin builds for wasm32-wasip2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust with wasm32-wasip2
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip2

      # Builds against the echo template's committed Cargo.lock (wit-bindgen 0.63.x)
      # and fails if the template stops compiling.
      - name: Build echo template
        working-directory: examples/plugin-template
        run: cargo build --target wasm32-wasip2 --release

      - name: Build trigger example
        working-directory: examples/plugin-template/trigger-example
        run: cargo build --target wasm32-wasip2 --release --locked

  cargo-deny:
    name: Dependency licenses, bans and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Policy lives in deny.toml. Advisories are left to security-audit.yml so a
      # newly published advisory fails the daily audit, not unrelated pull requests.
      # rust-version: the action image ships Rust 1.85, older than this workspace's
      # 1.96 floor, so it is updated to stable before cargo-deny reads the manifests.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: licenses bans sources
          rust-version: stable

  node-checks:
    name: Node.js dependency audit and dist staleness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Frontend tests (vitest)
        run: npm test

      - name: Check dist/ is not stale
        # Rebuilds the Vite frontend bundle and fails if dist/ differs from what is committed.
        # Uses `vite:build` (not `build`) because the `build` script invokes `tauri build`,
        # which requires GUI system libraries not available in a headless CI environment.
        # If this step fails, run `npm run vite:build` locally and commit the updated dist/.
        run: |
          npm run vite:build
          git diff --exit-code dist/ || (echo "ERROR: dist/ is stale — run 'npm run vite:build' and commit the result" && exit 1)
          untracked="$(git ls-files --others --exclude-standard dist/)"
          [ -z "$untracked" ] || (echo "ERROR: dist/ is stale — the build produced files that are not committed:" && echo "$untracked" && exit 1)

  docs-build:
    name: Docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

  tauri-build:
    name: Build desktop app (src-tauri)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: ubuntu-22.04-arm
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: startsWith(matrix.platform, 'ubuntu')
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Add swap space
        if: startsWith(matrix.platform, 'ubuntu')
        run: bash scripts/ci-add-swap.sh

      # GTK/WebKit bundling deps; same list as release.yml.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-

      - name: Install frontend dependencies
        run: npm ci

      # tauri.conf.json's externalBin expects src-tauri/binaries/node-bundled-<target-triple>
      # to already exist; without this, tauri build fails to find the sidecar.
      - name: Fetch and stage Node binaries
        shell: bash
        run: bash scripts/fetch-node-binaries.sh

      # Full `tauri build` (not vite:build) — this is the check the desktop binary
      # itself, not just the frontend bundle, actually compiles and packages on
      # every platform it ships for. Unsigned: the updater signing key lives only in
      # the `release` environment, so pull requests (including forks) never see it.
      - name: Build desktop app
        run: npm run build:unsigned

  tauri-test:
    name: Test desktop app (src-tauri)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Add swap space
        run: bash scripts/ci-add-swap.sh

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tauri-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-test-

      # The crate's build script requires the sidecar to exist, and dist/ is committed.
      - name: Fetch and stage Node binaries
        run: bash scripts/fetch-node-binaries.sh

      - name: Test desktop crate
        run: cargo test -p aerini --locked

      - name: Clippy desktop crate
        run: cargo clippy -p aerini --locked -- -D warnings
