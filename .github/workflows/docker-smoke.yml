name: Docker smoke

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'aerini-engine/**'
      - 'aerini-server/**'
      - 'Cargo.*'
      - 'NODE_VERSION'
      - 'scripts/smoke-test-docker.sh'
      - '.github/workflows/docker-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'aerini-engine/**'
      - 'aerini-server/**'
      - 'Cargo.*'
      - 'NODE_VERSION'
      - 'scripts/smoke-test-docker.sh'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image and run smoke test
        run: bash scripts/smoke-test-docker.sh
