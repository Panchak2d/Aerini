name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Keep equal to RUST_TOOLCHAIN in ci.yml so releases build with the toolchain CI tested.
  RUST_TOOLCHAIN: 1.97.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.verify.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag can be pushed from any commit. Only a commit that is on main and
      # already passed ci.yml may be released. If CI is still running, re-run this
      # job once it finishes.
      - name: Require the tagged commit to be on main and to have passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: ${GITHUB_SHA} is not on main. Release tags must point at a commit on main." >&2
            exit 1
          fi
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 100 --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "ERROR: no successful CI run found for ${GITHUB_SHA}. Wait for CI to pass on main, then re-run this job." >&2
            exit 1
          fi
          echo "CI passed for ${GITHUB_SHA} (${passed} successful run(s))"

      - name: Check tag against package.json, tauri.conf.json and Cargo.toml
        id: verify
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/verify-release-tag.sh "$TAG"

      - name: Check the updater configuration
        run: python3 -I scripts/verify-updater-config.py "$GITHUB_REPOSITORY"

      - name: Test the release scripts
        run: python3 -I -m unittest discover -s scripts/tests

  release:
    needs: verify
    # Holds the updater signing key; requires a reviewer's approval before any build runs.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: matrix.platform == 'ubuntu-22.04-arm'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Add swap space
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: bash scripts/ci-add-swap.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Fetch and stage Node binaries
        shell: bash
        run: bash scripts/fetch-node-binaries.sh

      # macOS builds are unsigned and unnotarized. Gatekeeper will warn users on first launch.
      # To suppress the warning: right-click the app → Open → Open. This is expected behaviour
      # for open-source releases without an Apple Developer account.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aerini ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **macOS note:** the build is unsigned. On first launch, right-click the app → Open → Open to bypass the Gatekeeper warning.
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false

  manifest:
    name: Publish updater manifest
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No signing key here: the manifest only lists what the build jobs already signed.
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-updater-manifest.sh "$GITHUB_REPOSITORY" "$TAG"

  mcp:
    name: Build aerini-mcp (${{ matrix.target }})
    # Needs the draft release that the desktop build creates. Holds no signing key, so it
    # runs after the approval the release job waited for and needs no environment of its own.
    needs: [verify, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
          - platform: macos-latest
            target: aarch64-apple-darwin
            python: python3
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: matrix.platform == 'ubuntu-22.04-arm'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Add swap space
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: bash scripts/ci-add-swap.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev

      - name: Check the runner builds for the expected target
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "ERROR: runner builds for '${host}', expected '${{ matrix.target }}'" >&2
            exit 1
          fi

      # Both programs are built by the same command apart from the feature, and both leave
      # target/release/aerini-mcp, so the first is packaged before the second overwrites it.
      - name: Build and package the online program
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          cargo build --release --locked -p aerini-mcp
          "$PYTHON" -I scripts/package-mcp.py \
            --binary "target/release/aerini-mcp${{ startsWith(matrix.platform, 'windows') && '.exe' || '' }}" \
            --name aerini-mcp --target "${{ matrix.target }}" \
            --version "${GITHUB_REF_NAME#v}" --license LICENSE --out-dir mcp-dist

      - name: Build and package the offline program
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          cargo build --release --locked -p aerini-mcp --features offline
          "$PYTHON" -I scripts/package-mcp.py \
            --binary "target/release/aerini-mcp${{ startsWith(matrix.platform, 'windows') && '.exe' || '' }}" \
            --name aerini-mcp-offline --target "${{ matrix.target }}" \
            --version "${GITHUB_REF_NAME#v}" --license LICENSE --out-dir mcp-dist

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/upload-release-assets.sh "$GITHUB_REPOSITORY" "$TAG" mcp-dist/*

  server:
    name: Build aerini-server (${{ matrix.target }})
    # Needs the draft release that the desktop build creates. Holds no signing key, so it
    # runs after the approval the release job waited for and needs no environment of its own.
    # Static musl build, the same target the container image uses, so one file runs on any
    # x86-64 Linux distribution.
    needs: [verify, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p aerini-server

      - name: Check the program is static and starts
        run: |
          binary="target/${{ matrix.target }}/release/aerini-server"
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "ERROR: ${binary} depends on shared libraries" >&2
            readelf -d "$binary" | grep '(NEEDED)' >&2
            exit 1
          fi
          "$binary" --help >/dev/null

      - name: Package
        run: |
          python3 -I scripts/package-mcp.py \
            --binary "target/${{ matrix.target }}/release/aerini-server" \
            --name aerini-server --target "${{ matrix.target }}" \
            --version "${GITHUB_REF_NAME#v}" --license LICENSE --out-dir server-dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/upload-release-assets.sh "$GITHUB_REPOSITORY" "$TAG" server-dist/*

  notes:
    name: List downloads in the release notes
    # Runs once every installer, latest.json, both MCP programs and the server program are on the release, so
    # the list covers all of them. Holds no signing key.
    needs: [release, manifest, mcp, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Group the downloads by system in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release-notes.sh "$GITHUB_REPOSITORY" "$TAG"

  smoke:
    name: Docker image smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image and run smoke test
        run: bash scripts/smoke-test-docker.sh

  docker:
    name: Publish container image
    # Waits for the approved desktop build and the smoke test, so an image is never
    # published for a release that was not approved or whose image does not run.
    needs: [verify, smoke, release]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest is only advanced for a real release; a prerelease tag still
      # publishes under its own version tag, just not as latest.
      - name: Compute image tags
        id: tags
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/panchak2d/aerini-server"
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" != "true" ]; then
            TAGS="$(printf '%s\n%s:latest' "$TAGS" "$IMAGE")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push aerini-server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
