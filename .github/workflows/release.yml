name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.verify.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag against package.json, tauri.conf.json and Cargo.toml
        id: verify
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/verify-release-tag.sh "$TAG"

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: matrix.platform == 'ubuntu-22.04-arm'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Add swap space
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: bash scripts/ci-add-swap.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Fetch and stage Node binaries
        shell: bash
        run: bash scripts/fetch-node-binaries.sh

      # macOS builds are unsigned and unnotarized. Gatekeeper will warn users on first launch.
      # To suppress the warning: right-click the app → Open → Open. This is expected behaviour
      # for open-source releases without an Apple Developer account.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aerini ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **macOS note:** the build is unsigned. On first launch, right-click the app → Open → Open to bypass the Gatekeeper warning.
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}

  docker:
    name: Publish container image
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest is only advanced for a real release; a prerelease tag still
      # publishes under its own version tag, just not as latest.
      - name: Compute image tags
        id: tags
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/panchak2d/aerini-server"
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" != "true" ]; then
            TAGS="$(printf '%s\n%s:latest' "$TAGS" "$IMAGE")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<TAGEOF"
            echo "$TAGS"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push aerini-server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
