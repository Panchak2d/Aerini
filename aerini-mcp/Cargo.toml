[package]
name = "aerini-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server for Aerini (stdio)"

[lib]
name = "aerini_mcp"
path = "src/lib.rs"

[[bin]]
name = "aerini-mcp"
path = "src/main.rs"

[features]
default = []
offline = ["dep:aerini-engine"]

[dependencies]
aerini-engine = { path = "../aerini-engine", optional = true }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = { version = "0.8", features = ["tokio"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
