[workspace]

[package]
name = "aerini-spike-trigger-host"
version = "0.0.0"
edition = "2021"
publish = false
description = "P8.0 spike (throwaway) -- async host harness for the WASI P3 echo-stream trigger guest. Not wired into aerini-engine/plugin_loader/."

[[bin]]
name = "spike-host"
path = "src/main.rs"

[dependencies]
# Exact pin, kept identical to aerini-engine/Cargo.toml, so this spike always
# exercises the same Wasmtime version the real engine ships.
# Feature set matches aerini-engine's: wasmtime's defaults minus `cache`, which pulls in the zstd crates
# (open RUSTSEC advisories), plus the component-model features this harness needs.
wasmtime = { version = "=49.0.5", default-features = false, features = [
    "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "component-model-async", "threads", "stack-switching", "std", "debug", "compile-time-builtins", "wit-parser",
] }
# `wasmtime_wasi::p3` and `wasmtime_wasi::p2` (and every fn in them, incl.
# `add_to_linker` / `add_to_linker_async`) are gated behind the crate's own "p3" and
# "p2" features, so both are requested explicitly here.
wasmtime-wasi = { version = "=49.0.5", features = ["p2", "p3"] }
tokio = { version = "1", features = ["full"] }
