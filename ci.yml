name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libdbus-1-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Verify dist is up to date
        run: |
          npm run build
          if ! git diff --exit-code dist/; then
            echo "ERROR: dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      # src-tauri excluded: requires Tauri-specific system GUI deps not available on ubuntu-latest.
      # Build and smoke-test locally with: npm run build && cargo build -p flowo
      - name: Build
        run: cargo build -p flowo-engine -p flowo-server --locked

      - name: Install Tauri system dependencies
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build src-tauri (compile check only)
        run: cargo build -p flowo --locked

      - name: Test
        run: cargo test -p flowo-engine --locked

      - name: Clippy
        run: cargo clippy -p flowo-engine -p flowo-server --locked -- -D warnings
