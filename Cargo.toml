[workspace]
members = [
    "src-tauri",
    "aerini-engine",
    "aerini-server",
]
# examples/plugin-template is a standalone wasm32-wasip2 Component Model plugin
# (see its own Cargo.toml / README), built via its own `cargo build --target
# wasm32-wasip2` invocation, not as a host-target member of this workspace.
# Excluded (not made a member) so `cargo build --workspace`/`cargo test --workspace`
# never attempt to compile it for the host target, and so `cargo build`/`cargo
# check` run *inside* examples/plugin-template don't fail with cargo's own
# "current package believes it's in a workspace when it's not" error.
exclude = [
    "examples/plugin-template",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0-only"
# Shared floor for every crate in the workspace (set by wasmtime's rust-version).
rust-version = "1.96"
