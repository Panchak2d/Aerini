[workspace]
members = [
    "src-tauri",
    "aerini-engine",
    "aerini-server",
]
# examples/plugin-template is a standalone wasm32-wasip2 Component Model plugin
# (see its own Cargo.toml / README), built via its own `cargo build --target
# wasm32-wasip2` invocation, not as a host-target member of this workspace.
# Excluded (not made a member) so `cargo build --workspace`/`cargo test --workspace`
# never attempt to compile it for the host target. Without this line, `cargo
# build`/`cargo check` run *inside* examples/plugin-template fails with cargo's
# own "current package believes it's in a workspace when it's not" error, since
# the directory sits under this root Cargo.toml but was previously neither a
# member nor excluded.
exclude = [
    "examples/plugin-template",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
